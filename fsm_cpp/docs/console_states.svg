<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1082" viewBox="0 0 1000 1082" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="1082" fill="#ffffff"/>

  <text x="440" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">console_demo — control-state machine (MainScreen::ControlState)</text>
  <text x="440" y="52" text-anchor="middle" font-size="12.5" fill="#64748b">start = CATHETER_DISCONNECTED &#183; green double border = idle / safe state</text>

  <g transform="translate(0,66)">
  <!-- Edges -->
  <g stroke="#475569" stroke-width="1.7" fill="none">
    <!-- start -->
    <path d="M360,20 L360,46" marker-end="url(#arrow)"/>
    <!-- main spine -->
    <path d="M360,92 L360,153" marker-end="url(#arrow)"/>
    <path d="M360,197 L360,258" marker-end="url(#arrow)"/>
    <path d="M360,302 L360,373" marker-end="url(#arrow)"/>
    <path d="M360,417 L360,488" marker-end="url(#arrow)"/>
    <path d="M360,532 L360,593" marker-end="url(#arrow)"/>
    <path d="M360,637 L360,698" marker-end="url(#arrow)"/>
    <path d="M360,742 L360,803" marker-end="url(#arrow)"/>
    <!-- right side -->
    <path d="M448,395 L532,395" marker-end="url(#arrow)"/>
    <path d="M620,417 C620,485 540,510 452,510" marker-end="url(#arrow)"/>
    <path d="M560,373 C520,335 420,338 386,372" marker-end="url(#arrow)"/>
    <path d="M448,505 C512,492 512,424 450,410" marker-end="url(#arrow)"/>
    <path d="M448,610 C575,595 575,420 450,402" marker-end="url(#arrow)"/>
    <path d="M760,598 C760,120 560,70 452,70" marker-end="url(#arrow)"/>
    <!-- left side returns -->
    <path d="M272,825 C150,825 150,395 270,395" marker-end="url(#arrow)"/>
    <path d="M272,393 C60,393 60,72 270,70" marker-end="url(#arrow)"/>
  </g>
  <!-- Fault (consolidated, dashed red) + explicit self-loop on ERROR -->
  <g stroke="#b91c1c" stroke-width="1.7" fill="none" stroke-dasharray="6 4">
    <path d="M450,620 L672,620" marker-end="url(#arrowRed)"/>
    <path d="M848,610 C908,588 908,652 850,632" marker-end="url(#arrowRed)"/>
  </g>

  <!-- States -->
  <!-- idle/safe (double border) -->
  <g>
    <rect x="272" y="48"  width="176" height="44" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.8"/>
    <rect x="276" y="52"  width="168" height="36" rx="7"  fill="none"    stroke="#15803d" stroke-width="1.1"/>
    <rect x="272" y="153" width="176" height="44" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.8"/>
    <rect x="276" y="157" width="168" height="36" rx="7"  fill="none"    stroke="#15803d" stroke-width="1.1"/>
    <rect x="272" y="373" width="176" height="44" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.8"/>
    <rect x="276" y="377" width="168" height="36" rx="7"  fill="none"    stroke="#15803d" stroke-width="1.1"/>
  </g>
  <!-- normal -->
  <g>
    <rect x="272" y="258" width="176" height="44" rx="10" fill="#e0e7ff" stroke="#4338ca" stroke-width="1.6"/>
    <rect x="272" y="488" width="176" height="44" rx="10" fill="#e0e7ff" stroke="#4338ca" stroke-width="1.6"/>
    <rect x="272" y="698" width="176" height="44" rx="10" fill="#e0e7ff" stroke="#4338ca" stroke-width="1.6"/>
    <rect x="272" y="803" width="176" height="44" rx="10" fill="#e0e7ff" stroke="#4338ca" stroke-width="1.6"/>
    <rect x="532" y="373" width="176" height="44" rx="10" fill="#e0e7ff" stroke="#4338ca" stroke-width="1.6"/>
  </g>
  <!-- energy delivery (amber) -->
  <rect x="272" y="593" width="176" height="44" rx="10" fill="#fde68a" stroke="#d97706" stroke-width="1.8"/>
  <!-- error (red) -->
  <rect x="672" y="598" width="176" height="44" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.8"/>

  <g text-anchor="middle" font-size="11.5" font-weight="700">
    <text x="360" y="74"  fill="#14532d">CATHETER_DISCONNECTED</text>
    <text x="360" y="179" fill="#14532d">SYSTEM_READY</text>
    <text x="360" y="284" fill="#312e81">CHARGING</text>
    <text x="360" y="399" fill="#14532d">CHARGED</text>
    <text x="360" y="514" fill="#312e81">ABLATE_READY</text>
    <text x="360" y="619" fill="#7c2d12">ABLATE_ACTIVE</text>
    <text x="360" y="724" fill="#312e81">ABLATE_COMPLETE</text>
    <text x="360" y="829" fill="#312e81">COOLDOWN</text>
    <text x="620" y="399" fill="#312e81">PACE_CAPTURE</text>
    <text x="760" y="624" fill="#7f1d1d">ERROR</text>
  </g>

  <!-- Edge labels (on top) -->
  <g font-size="12" fill="#475569" text-anchor="middle" style="paint-order:stroke; stroke:#ffffff; stroke-width:3.5px; stroke-linejoin:round;">
    <text x="378" y="36" text-anchor="start">start</text>
    <text x="360" y="126">CatheterConnected</text>
    <text x="360" y="231">Prepare</text>
    <text x="360" y="341">ChargeComplete</text>
    <text x="360" y="456">Confirm</text>
    <text x="360" y="566">Deliver</text>
    <text x="360" y="671">AblateComplete</text>
    <text x="360" y="776">CooldownStart</text>
    <text x="490" y="388">Pace</text>
    <text x="566" y="474">Confirm</text>
    <text x="470" y="330">Abort</text>
    <text x="524" y="458">Abort</text>
    <text x="588" y="512">Abort</text>
    <text x="600" y="104">ClearError</text>
  </g>
  <!-- rotated left-lane labels -->
  <g font-size="12" fill="#475569" style="paint-order:stroke; stroke:#ffffff; stroke-width:3.5px; stroke-linejoin:round;">
    <text x="138" y="610" text-anchor="middle" transform="rotate(-90 138 610)">CooldownComplete</text>
    <text x="48" y="235" text-anchor="middle" transform="rotate(-90 48 235)">CatheterDisconnected</text>
  </g>
  <text x="561" y="612" text-anchor="middle" font-size="12" fill="#b91c1c" style="paint-order:stroke; stroke:#ffffff; stroke-width:3.5px; stroke-linejoin:round;">Fault</text>
  <text x="915" y="608" font-size="11" fill="#b91c1c" style="paint-order:stroke; stroke:#ffffff; stroke-width:3.5px; stroke-linejoin:round;">Fault / log</text>

  <!-- Notes for the consolidated bulk transitions -->
  <g font-size="11.5" fill="#334155">
    <rect x="60" y="862" width="880" height="124" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="78" y="886" font-weight="700" fill="#475569">Consolidated transitions (drawn once for readability):</text>
    <text x="78" y="908"><tspan fill="#b91c1c" font-weight="700">Fault</tspan> (red dashed) &#8594; ERROR &#8212; from every state (in ERROR it self-loops and is logged):</text>
    <text x="98" y="927">CATHETER_DISCONNECTED, SYSTEM_READY, CHARGING, CHARGED, PACE_CAPTURE, ABLATE_READY, ABLATE_ACTIVE, ABLATE_COMPLETE, COOLDOWN, ERROR.</text>
    <text x="98" y="945" font-style="italic" fill="#64748b">ClearError returns to CATHETER_DISCONNECTED, which reconnects to SYSTEM_READY on CatheterConnected.</text>
    <text x="78" y="967"><tspan font-weight="700">CatheterDisconnected</tspan> &#8594; CATHETER_DISCONNECTED &#8212; from: SYSTEM_READY, CHARGING, CHARGED, ABLATE_READY.</text>
  </g>

  <!-- Legend -->
  <g font-size="11.5" fill="#334155">
    <rect x="700" y="664" width="280" height="116" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/>
    <text x="714" y="684" font-weight="700" fill="#475569">Legend</text>
    <rect x="714" y="694" width="20" height="14" rx="4" fill="#dcfce7" stroke="#15803d"/>
    <rect x="717" y="697" width="14" height="8" rx="2" fill="none" stroke="#15803d" stroke-width="0.9"/>
    <text x="744" y="705">idle / safe state</text>
    <rect x="714" y="716" width="20" height="14" rx="4" fill="#fde68a" stroke="#d97706"/>
    <text x="744" y="727">energy delivery active</text>
    <rect x="714" y="738" width="20" height="14" rx="4" fill="#fee2e2" stroke="#b91c1c"/>
    <text x="744" y="749">fault / error</text>
    <rect x="714" y="760" width="20" height="14" rx="4" fill="#e0e7ff" stroke="#4338ca"/>
    <text x="744" y="771">operational state</text>
  </g>
  </g>
</svg>
