<svg xmlns="http://www.w3.org/2000/svg" width="620" height="360" viewBox="0 0 620 360" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="620" height="360" fill="#ffffff"/>

  <text x="310" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">demo — parity DFA (even number of 1s)</text>
  <text x="310" y="56" text-anchor="middle" font-size="12.5" fill="#64748b">&#931;={0,1} &#183; start = even &#183; accepting = {even}</text>

  <!-- Edges -->
  <g stroke="#475569" stroke-width="1.7" fill="none">
    <!-- start -->
    <path d="M120,195 L158,195" marker-end="url(#arrow)"/>
    <!-- even on 1 to odd (top) -->
    <path d="M251,166 Q320,112 389,166" marker-end="url(#arrow)"/>
    <!-- odd on 1 to even (bottom) -->
    <path d="M389,224 Q320,278 251,224" marker-end="url(#arrow)"/>
    <!-- even self 0 (left) -->
    <path d="M163,178 C104,154 104,236 163,212" marker-end="url(#arrow)"/>
    <!-- odd self 0 (right) -->
    <path d="M477,178 C536,154 536,236 477,212" marker-end="url(#arrow)"/>
  </g>

  <!-- States -->
  <!-- even: start + accepting (double ring) -->
  <circle cx="210" cy="195" r="50" fill="#dcfce7" stroke="#15803d" stroke-width="1.8"/>
  <circle cx="210" cy="195" r="44" fill="none" stroke="#15803d" stroke-width="1.4"/>
  <text x="210" y="200" text-anchor="middle" font-size="15" font-weight="700" fill="#14532d">even</text>
  <!-- odd -->
  <circle cx="430" cy="195" r="50" fill="#e0e7ff" stroke="#4338ca" stroke-width="1.8"/>
  <text x="430" y="200" text-anchor="middle" font-size="15" font-weight="700" fill="#312e81">odd</text>

  <!-- Edge labels (on top) -->
  <g font-size="13" fill="#475569" text-anchor="middle" style="paint-order:stroke; stroke:#ffffff; stroke-width:3.5px; stroke-linejoin:round;">
    <text x="109" y="188">start</text>
    <text x="320" y="120">1</text>
    <text x="320" y="268">1</text>
    <text x="92" y="200">0</text>
    <text x="548" y="200">0</text>
  </g>

  <!-- Legend -->
  <g font-size="11.5" fill="#334155">
    <circle cx="366" cy="326" r="7" fill="#dcfce7" stroke="#15803d"/>
    <circle cx="366" cy="326" r="4.2" fill="none" stroke="#15803d"/>
    <text x="380" y="330">double ring = accepting state</text>
  </g>
</svg>
